# OV-Works integrity verification targets.
#
# The files the integrity verification (AIDE) measures, by exact name: those of the main processes
# (ovirt-engine with its libraries, the web server, the database, the KEK agent, the data
# warehouse, the websocket proxy) and of the self-test and integrity verification themselves.
# A path may hold a * (resolved when engine-setup writes the AIDE configuration).
# Read by engine-setup (ovirt_engine_setup/aide.py), which writes the AIDE configuration from it;
# the engine (IntegrityTargets) records the result of every file, with its process, from that
# configuration. The self-test (ov-works-security_audit.sh) checks the processes themselves -
# that they run and answer - and does not read this list.
#
# Fields: PROCESS TYPE FLAGS PATH
#   TYPE   exec  an executable of the process (tree: a directory, every file in it)
#          conf  a configuration file of the process
#   FLAGS  comma separated, or - for none
#          secret    holds a password or a private key
#          optional  may not exist on a working installation
#          mutable   rewritten by the engine or an administrator's tool in approved work:
#                    integrity verification watches ownership and permissions, not content
#          tree      a directory, measured with everything in it
#
# Not measured: /etc/ovirt-engine/encryptor/config.json (the KEK agent's settings, which the
# engine rewrites from the screen - the terminal serial number - and engine-setup on every run).

ovirt-engine            exec  -                 /usr/share/ovirt-engine/services/ovirt-engine/ovirt-engine.py
ovirt-engine            exec  tree              /usr/share/ovirt-engine/engine.ear
ovirt-engine            exec  tree              /usr/share/ovirt-engine/modules
ovirt-engine            exec  -                 /usr/share/ovirt-engine-wildfly/jboss-modules.jar
ovirt-engine            exec  tree              /usr/lib/python3*/site-packages/ovirt_engine
ovirt-engine            conf  -                 /usr/lib/systemd/system/ovirt-engine.service
ovirt-engine            conf  -                 /usr/share/ovirt-engine/services/ovirt-engine/ovirt-engine.conf
ovirt-engine            conf  secret            /etc/ovirt-engine/engine.conf.d/10-setup-database.conf
ovirt-engine            conf  -                 /etc/ovirt-engine/engine.conf.d/10-setup-protocols.conf
ovirt-engine            conf  optional          /etc/ovirt-engine/engine.conf.d/10-setup-jboss.conf
ovirt-engine            conf  -                 /etc/ovirt-engine/engine.conf.d/10-setup-pki.conf
ovirt-engine            conf  optional          /etc/ovirt-engine/engine.conf.d/10-setup-java.conf
ovirt-engine            conf  optional          /etc/ovirt-engine/engine.conf.d/11-setup-sso.conf
ovirt-engine            conf  secret            /etc/ovirt-engine/aaa/internal.properties
ovirt-engine            conf  -                 /etc/ovirt-engine/extensions.d/internal-authn.properties
ovirt-engine            conf  -                 /etc/ovirt-engine/extensions.d/internal-authz.properties

ovirt-engine-kek-agent  exec  -                 /usr/share/ovirt-engine/encryptor/kek_agent.py
ovirt-engine-kek-agent  exec  -                 /usr/share/ovirt-engine/encryptor/encryptor.py
ovirt-engine-kek-agent  conf  -                 /usr/lib/systemd/system/ovirt-engine-kek-agent.service
ovirt-engine-kek-agent  conf  secret,optional   /etc/ovirt-engine/encryptor/dek.enc

ovirt-engine-proxy      exec  -                 /usr/sbin/httpd
ovirt-engine-proxy      conf  -                 /etc/httpd/conf/httpd.conf
ovirt-engine-proxy      conf  -                 /etc/httpd/conf.d/ssl.conf
ovirt-engine-proxy      conf  mutable           /etc/httpd/conf.d/z-ovirt-engine-proxy.conf
ovirt-engine-proxy      conf  optional          /etc/httpd/conf.d/ovirt-engine-root-redirect.conf
ovirt-engine-proxy      conf  -                 /etc/pki/ovirt-engine/certs/apache.cer
ovirt-engine-proxy      conf  secret            /etc/pki/ovirt-engine/keys/apache.key.nopass

postgresql              exec  -                 /usr/bin/postgres
postgresql              conf  secret            /var/lib/pgsql/data/postgresql.conf
postgresql              conf  secret,mutable    /var/lib/pgsql/data/pg_hba.conf

ovirt-engine-dwhd       exec  -                 /usr/share/ovirt-engine-dwh/services/ovirt-engine-dwhd/ovirt-engine-dwhd.py
ovirt-engine-dwhd       conf  -                 /usr/share/ovirt-engine-dwh/services/ovirt-engine-dwhd/ovirt-engine-dwhd.conf
ovirt-engine-dwhd       conf  secret            /etc/ovirt-engine-dwh/ovirt-engine-dwhd.conf.d/10-setup-database.conf
ovirt-engine-dwhd       conf  secret,optional   /etc/ovirt-engine/engine.conf.d/10-setup-dwh-database.conf

ovirt-websocket-proxy   exec  -                 /usr/share/ovirt-engine/services/ovirt-websocket-proxy/ovirt-websocket-proxy.py
ovirt-websocket-proxy   conf  -                 /usr/share/ovirt-engine/services/ovirt-websocket-proxy/ovirt-websocket-proxy.conf
ovirt-websocket-proxy   conf  optional          /etc/ovirt-engine/ovirt-websocket-proxy.conf.d/10-setup.conf
ovirt-websocket-proxy   conf  -                 /etc/pki/ovirt-engine/certs/websocket-proxy.cer
ovirt-websocket-proxy   conf  secret            /etc/pki/ovirt-engine/keys/websocket-proxy.key.nopass

security-verification   exec  -                 /usr/share/ovirt-engine/bin/ov-works-security_audit.sh
security-verification   exec  -                 /usr/share/ovirt-engine/bin/ovirt-engine-security-verification-runner.sh
security-verification   exec  -                 /usr/share/ovirt-engine/bin/ovirt-engine-security-halt.sh
security-verification   exec  -                 /usr/share/ovirt-engine/encryptor/integrity_seal.py
security-verification   exec  -                 /usr/sbin/aide
security-verification   conf  -                 /usr/lib/systemd/system/ovirt-engine-security-audit.service
security-verification   conf  -                 /usr/lib/systemd/system/ovirt-engine-security-audit.timer
security-verification   conf  -                 /usr/lib/systemd/system/ovirt-engine-security-halt.path
security-verification   conf  -                 /usr/lib/systemd/system/ovirt-engine-security-halt.service
security-verification   conf  -                 /etc/sudoers.d/ovirt-aide
